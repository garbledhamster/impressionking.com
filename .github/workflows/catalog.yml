name: Refresh public TikTok catalog
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/catalog.yml'
      - 'tools/import_catalog.py'
      - 'tests/catalog_import_test.py'
  workflow_dispatch:
  schedule:
    - cron: '17 11 * * *'
permissions:
  contents: write
  pages: write
concurrency:
  group: public-catalog
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate importer
        run: python -m unittest discover -s tests -p '*_test.py'
      - name: Import one public recent-post window
        id: import
        shell: bash
        run: |
          result=$(python tools/import_catalog.py --write)
          echo "$result"
          added=$(python -c 'import json,sys; print(json.load(sys.stdin)["added"])' <<< "$result")
          echo "added=$added" >> "$GITHUB_OUTPUT"
      - name: Publish new records
        if: steps.import.outputs.added != '0'
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/catalog.json data/catalog-source.json
          git commit -m 'Refresh public TikTok catalog'
          git push origin HEAD:main
      - name: Request the existing Pages build
        if: steps.import.outputs.added != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds"
